
server:
  port: ${PORT:8080}

spring:
  application:
    name: knowledgehub-backend

  data:
    mongodb:
      uri: ${MONGODB_METADATA_URI}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

app:
  mongodb:
    metadata-uri: ${MONGODB_METADATA_URI}
    vector-uri: ${MONGODB_VECTOR_URI}
